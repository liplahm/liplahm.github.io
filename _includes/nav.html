<header class="site-head">
  <a class="site-name" href="{{ '/' | relative_url }}">{{ site.name }}</a>
  <nav class="site-nav" aria-label="Main">
    <a href="{{ '/' | relative_url }}#research"{% if page.url == '/' %} aria-current="page"{% endif %}>Research</a>
    <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' %} aria-current="page"{% endif %}>Blog</a>
    {% if site.cv_pdf != "" %}<a href="{{ site.cv_pdf | relative_url }}">CV</a>{% endif %}
  </nav>
</header>
